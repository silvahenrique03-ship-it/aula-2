<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo - classes</title>
    <style>
        div{
            display: inline-block;
            background-color: rgb(93, 156, 219);
            height: 200px ;
            width: 200px;
            border: 1px solid rgb(206, 0, 0);
            text-align: center;
        }

    div:hover {
        background-color: rgb(219, 25, 25);
    }
    </style>
</head>
<body>
    <div id="d1">01</div>
    <div id="d2" >02</div>
    <div id="d3">03</div>
    <div id="d4">04</div>
</body>
</html>
